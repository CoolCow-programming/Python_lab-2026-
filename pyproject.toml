[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "online_school"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3"
]

[project.scripts]
online_school = "online_school.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

